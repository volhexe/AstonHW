spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration  # Full for mail health

  boot:
    autoconfigure:
      exclude:
        - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
        - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
        - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration


eureka:
  client:
    enabled: false

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example: DEBUG
    org.springframework.cloud: OFF
    org.springframework.boot.autoconfigure: INFO